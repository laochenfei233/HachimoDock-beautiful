name: Build installers

# 四架构安装包构建（windows-x64 / macos-arm64 / macos-x64 / windows-arm64）。
# FFmpeg/Node 运行时按源码审计表逐字节校验，校验不过就不产包：
# - windows-x64：官方安装包内已审计运行时直接抽取。
# - macos-arm64：官方 dmg 内实际分发的运行时（审计表指向该哈希）。
# - macos-x64 / windows-arm64：运行时由 bootstrap 构建（FFmpeg 交叉编译 + 官方
#   Node 分发包经 SHASUMS 校验），首轮运行打印哈希用于补录审计表，补录后出包。

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_SETUP_URL: https://github.com/ai-maker-lab/HachimoDock/releases/download/v0.1.245/HachimiDock_0.1.245_Windows-x64-setup.exe
  UPSTREAM_DMG_URL: https://github.com/ai-maker-lab/HachimoDock/releases/download/v0.1.245/HachimiDock_0.1.245_macOS-arm64.dmg
  NODE_VERSION: v26.7.0
  AUDIT_FFMPEG_WIN_X64: 18ac8e4c695148f3e2e20b6a24b3974a7b350b3a6dee1c8a018db5c2d1b3fc4f
  AUDIT_FFMPEG_MAC_ARM64: 89c2d30bc9145bb76bdf2a94312f58316cb66ebbf7cd608cf480e6d350cd4b75
  AUDIT_FFMPEG_SOURCE: 99b393871f64a2d860587bcf0f9bdbf68b28693100b51c9dfdf3f37b604896a9

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage firmware OTA inputs
        run: python pc/scripts/stage-release-firmware.py

      - name: Extract audited runtime from the official setup (silent install)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:UPSTREAM_SETUP_URL -OutFile setup.exe -MaximumRedirection 5
          Start-Process -Wait -FilePath .\setup.exe -ArgumentList '/S', '/D=C:\stage\app'
          $expect = @{
            'C:\stage\app\tools\ffmpeg.exe' = $env:AUDIT_FFMPEG_WIN_X64
            'C:\stage\app\tools\source\ffmpeg-8.1.3.tar.xz' = $env:AUDIT_FFMPEG_SOURCE
          }
          foreach ($path in $expect.Keys) {
            if (-not (Test-Path $path)) { throw "official installer did not contain $path" }
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
            if ($hash -ne $expect[$path]) { throw "audit hash mismatch for $path`: $hash" }
          }
          foreach ($name in 'tools\ffmpeg.LICENSE', 'tools\ffmpeg.README', 'tools\ffmpeg.SOURCE.txt', 'tools\zlib.LICENSE', 'bridge\runtime\node.exe') {
            if (-not (Test-Path "C:\stage\app\$name")) { throw "official installer did not contain $name" }
          }
          "PET_MANAGER_FFMPEG_BIN=C:\stage\app\tools\ffmpeg.exe" >> $env:GITHUB_ENV
          "PET_MANAGER_FFMPEG_README=C:\stage\app\tools\ffmpeg.README" >> $env:GITHUB_ENV
          "PET_MANAGER_FFMPEG_LICENSE=C:\stage\app\tools\ffmpeg.LICENSE" >> $env:GITHUB_ENV
          "PET_MANAGER_FFMPEG_SOURCE_ARCHIVE=C:\stage\app\tools\source\ffmpeg-8.1.3.tar.xz" >> $env:GITHUB_ENV
          "PET_MANAGER_ZLIB_LICENSE=C:\stage\app\tools\zlib.LICENSE" >> $env:GITHUB_ENV
          "PET_MANAGER_NODE_BIN=C:\stage\app\bridge\runtime\node.exe" >> $env:GITHUB_ENV
          "PET_MANAGER_TARGET_ARCH=x64" >> $env:GITHUB_ENV
          # prepare 阶段对 terrier-clips 调 PATH 上的 ffmpeg 做时长探测；
          # 追加语义必须走 GITHUB_PATH 文件（GITHUB_ENV 的 PATH 会整体替换 runner PATH）。
          "C:\stage\app\tools" >> $env:GITHUB_PATH

      - name: npm ci (client)
        working-directory: pc
        run: npm ci

      - name: Restore audited bridge production dependencies (locked)
        working-directory: pc/src-tauri/bridge/packages/clawd-backend-service
        run: npm ci

      - name: Prepare desktop resources (MSVC C2x for the WAMR checker)
        working-directory: pc
        env:
          # runner 的 MSVC 对 WAMR 空结构体报 C2016，且不认识任何 /std 选项；
          # CL 环境变量给每次 cl.exe 追加 /std:c20。只作用于 prepare 阶段，
          # 不让它泄漏进 Rust 的 cc 构建链。
          CL: /std:c20
        run: npm run prepare:desktop

      # NSIS 用配置里的预发布版本（0.1.245-rc.1）；MSI/WiX 只接受纯数字版本，
      # 因此 MSI 单独以基础版本号构建（与既往 0.1.230-rc1 的打包方式一致）。
      - name: Build NSIS with the configured version
        working-directory: pc
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Build MSI with the numeric base version
        working-directory: pc
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles msi --ci --config '{"version":"0.1.245"}'

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item pc\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe dist\
          Copy-Item pc\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi dist\

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installers
          path: dist/

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage firmware OTA inputs
        run: python pc/scripts/stage-release-firmware.py

      - name: Mount the official dmg and export its runtime
        run: |
          set -euo pipefail
          curl -L -o official.dmg "$UPSTREAM_DMG_URL"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/official official.dmg
          APP="$(find /Volumes/official -maxdepth 2 -name '*.app' | head -1)"
          RES="$APP/Contents/Resources"
          test -f "$RES/tools/ffmpeg" || { echo "official dmg did not contain tools/ffmpeg"; exit 1; }
          ffmpeg_hash="$(shasum -a 256 "$RES/tools/ffmpeg" | cut -d' ' -f1)"
          node_hash="$(shasum -a 256 "$RES/bridge/runtime/node" | cut -d' ' -f1)"
          source_hash="$(shasum -a 256 "$RES/tools/source/ffmpeg-8.1.3.tar.xz" | cut -d' ' -f1)"
          echo "dmg ffmpeg sha256 = $ffmpeg_hash"
          echo "dmg node sha256 = $node_hash"
          echo "dmg source tar sha256 = $source_hash"
          if [ "$ffmpeg_hash" != "$AUDIT_FFMPEG_MAC_ARM64" ] || [ "$source_hash" != "$AUDIT_FFMPEG_SOURCE" ]; then
            echo "::error title=Audit mismatch::dmg ffmpeg $ffmpeg_hash / source $source_hash 与源码审计表不符"
          fi
          mkdir -p "$GITHUB_WORKSPACE/official-runtime"
          cp "$RES/tools/ffmpeg" "$RES/tools/ffmpeg.LICENSE" "$RES/tools/ffmpeg.README" \
             "$RES/tools/source/ffmpeg-8.1.3.tar.xz" "$RES/bridge/runtime/node" "$GITHUB_WORKSPACE/official-runtime/"
          hdiutil detach /Volumes/official || true
          {
            echo "PET_MANAGER_FFMPEG_BIN=$GITHUB_WORKSPACE/official-runtime/ffmpeg"
            echo "PET_MANAGER_FFMPEG_README=$GITHUB_WORKSPACE/official-runtime/ffmpeg.README"
            echo "PET_MANAGER_FFMPEG_LICENSE=$GITHUB_WORKSPACE/official-runtime/ffmpeg.LICENSE"
            echo "PET_MANAGER_FFMPEG_SOURCE_ARCHIVE=$GITHUB_WORKSPACE/official-runtime/ffmpeg-8.1.3.tar.xz"
            echo "PET_MANAGER_NODE_BIN=$GITHUB_WORKSPACE/official-runtime/node"
            echo "PET_MANAGER_TARGET_ARCH=arm64"
          } >> "$GITHUB_ENV"
          # prepare 对 terrier-clips 调 PATH 上的 ffmpeg 做时长探测（追加语义走 GITHUB_PATH）
          echo "$GITHUB_WORKSPACE/official-runtime" >> "$GITHUB_PATH"

      - name: npm ci (client)
        working-directory: pc
        run: npm ci

      - name: Restore audited bridge production dependencies (locked)
        working-directory: pc/src-tauri/bridge/packages/clawd-backend-service
        run: npm ci

      - name: Build (prepare:desktop + tauri build app,dmg, ad-hoc signed)
        working-directory: pc
        run: npm run build:mac

      - name: Collect installers
        run: |
          mkdir -p dist
          cp pc/src-tauri/target/release/bundle/dmg/*.dmg dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-installer
          path: dist/

  macos-x64:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage firmware OTA inputs
        run: python pc/scripts/stage-release-firmware.py

      - name: Fetch the official x64 Node (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p runtime
          # nodejs.org 偶发不可达：重试后回退 npmmirror 镜像；SHASUMS 与包须同源校验
          ARCHIVE="node-$NODE_VERSION-darwin-x64.tar.gz"
          fetch_node() {
            for base in "https://nodejs.org/dist" "https://npmmirror.com/mirrors/node"; do
              # 按 SHASUMS 里的规范文件名落盘，shasum -c 才能找到文件
              curl -fsSL --retry 3 -o "$ARCHIVE" "$base/$NODE_VERSION/$ARCHIVE" || continue
              curl -fsSL --retry 3 -o SHASUMS256.txt "$base/$NODE_VERSION/SHASUMS256.txt" || continue
              grep " $ARCHIVE$" SHASUMS256.txt | shasum -a 256 -c - && { echo "fetched from $base"; return 0; }
            done
            return 1
          }
          fetch_node
          tar -xzf "$ARCHIVE" --strip-components=2 -C runtime "node-$NODE_VERSION-darwin-x64/bin/node"
          node_hash="$(shasum -a 256 runtime/node | cut -d' ' -f1)"
          echo "official darwin-x64 node sha256 = $node_hash"

      - name: Cross-build FFmpeg 8.1.3 x64 from the audited source tar
        run: |
          set -euo pipefail
          curl -L -o official.dmg "$UPSTREAM_DMG_URL"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/official official.dmg
          APP="$(find /Volumes/official -maxdepth 2 -name '*.app' | head -1)"
          RES="$APP/Contents/Resources"
          mkdir -p runtime
          cp "$RES/tools/source/ffmpeg-8.1.3.tar.xz" runtime/
          cp "$RES/tools/ffmpeg.LICENSE" runtime/ffmpeg.LICENSE
          hdiutil detach /Volumes/official || true
          source_hash="$(shasum -a 256 runtime/ffmpeg-8.1.3.tar.xz | cut -d' ' -f1)"
          test "$source_hash" = "$AUDIT_FFMPEG_SOURCE" || { echo "source tar mismatch: $source_hash"; exit 1; }
          cd runtime
          # 源码包顶层目录名不固定：解到固定目录，避免按名字 cd
          rm -rf src && mkdir src
          tar -xf ffmpeg-8.1.3.tar.xz -C src --strip-components=1
          cd src
          export SOURCE_DATE_EPOCH=0
          CONFIGURE="./configure --prefix=$PWD/dist --arch=x86_64 --target-os=darwin --enable-cross-compile \
            --disable-debug --disable-doc --disable-ffplay --disable-ffprobe --disable-avdevice \
            --disable-network --disable-autodetect --disable-gpl --disable-nonfree \
            --enable-static --disable-shared --disable-zlib --disable-x86asm --enable-videotoolbox \
            --extra-cflags=\"-arch x86_64 -ffile-prefix-map=$PWD=.\" \\
            --extra-ldflags=\"-arch x86_64 -Wl,-no_uuid\""
          eval "$CONFIGURE"
          make -j4
          make install
          cd ../..
          mkdir -p runtime/bin
          # 此时 cwd 是仓库根：源码在 runtime/src 下
          BIN=runtime/src/dist/bin/ffmpeg
          [ -f "$BIN" ] || BIN=runtime/src/ffmpeg
          test -f "$BIN"
          cp "$BIN" runtime/bin/ffmpeg
          test -x runtime/bin/ffmpeg
          ffmpeg_hash="$(shasum -a 256 runtime/bin/ffmpeg | cut -d' ' -f1)"
          echo "built macos-x64 ffmpeg sha256 = $ffmpeg_hash"
          # prepare 会在 target==host 时执行 x64 ffmpeg 做版本/编码器探测，需要 Rosetta
          if ! /usr/bin/pgrep -q oahd 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          fi
          runtime/bin/ffmpeg -hide_banner -version | head -1
          # 从 config.h 取证编码器真的编译进来
          # FFmpeg 把编解码器宏写在 config_components.h
          grep -q "define CONFIG_H264_VIDEOTOOLBOX_ENCODER 1" runtime/src/config_components.h || { echo "h264_videotoolbox not enabled"; exit 1; }
          # ffmpeg.README 必须包含 prepare 的三个必需标记
          {
            echo "Pet Manager FFmpeg runtime (macos-x64, built in CI from the audited source tar)"
            echo "FFmpeg version: 8.1.3"
            echo "H.264 encoder used by Pet Manager: h264_videotoolbox (VideoToolbox)"
            echo "CONFIG_H264_VIDEOTOOLBOX_ENCODER=1"
            echo "$CONFIGURE"
          } > runtime/ffmpeg.README

      - name: Export runtime for prepare
        run: |
          set -euo pipefail
          test -f runtime/bin/ffmpeg
          test -f runtime/ffmpeg.README
          {
            echo "PET_MANAGER_FFMPEG_BIN=$GITHUB_WORKSPACE/runtime/bin/ffmpeg"
            echo "PET_MANAGER_FFMPEG_README=$GITHUB_WORKSPACE/runtime/ffmpeg.README"
            echo "PET_MANAGER_FFMPEG_LICENSE=$GITHUB_WORKSPACE/runtime/ffmpeg.LICENSE"
            echo "PET_MANAGER_FFMPEG_SOURCE_ARCHIVE=$GITHUB_WORKSPACE/runtime/ffmpeg-8.1.3.tar.xz"
            echo "PET_MANAGER_NODE_BIN=$GITHUB_WORKSPACE/runtime/node"
            echo "PET_MANAGER_TARGET_ARCH=x64"
          } >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/runtime/bin" >> "$GITHUB_PATH"

      - name: npm ci (client)
        working-directory: pc
        run: npm ci

      - name: Restore audited bridge production dependencies (locked)
        working-directory: pc/src-tauri/bridge/packages/clawd-backend-service
        run: npm ci

      - name: Add the x64 Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Build (prepare:desktop + tauri build app,dmg for x64)
        working-directory: pc
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin
        run: |
          set -e
          npm run prepare:desktop
          npx tauri build --target x86_64-apple-darwin --bundles app,dmg --ci

      - name: Collect installers
        run: |
          mkdir -p dist
          cp pc/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-installer
          path: dist/

  windows-arm64-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install extract and cross toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          # 固定版本保证可复现；资产名带 ubuntu 版本号
          LLVM_MINGW_TAG=20261117
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz"
          echo "llvm-mingw: $LLVM_MINGW_URL"
          curl -fsSL --retry 3 -o llvm-mingw.tar.xz "$LLVM_MINGW_URL"
          mkdir -p "$GITHUB_WORKSPACE/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz --strip-components=1 -C "$GITHUB_WORKSPACE/llvm-mingw"
          echo "$GITHUB_WORKSPACE/llvm-mingw/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract the audited source tar from the official setup
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o setup.exe "$UPSTREAM_SETUP_URL"
          mkdir -p runtime
          # NSIS 安装包用 7z 解包（不需要运行 Windows 安装器）
          7z x setup.exe -oextracted -y > /dev/null
          SRC="$(find extracted -name 'ffmpeg-8.1.3.tar.xz' | head -1)"
          LIC="$(find extracted -name 'ffmpeg.LICENSE' | head -1)"
          ZLIB="$(find extracted -name 'zlib.LICENSE' | head -1)"
          test -n "$SRC" && test -n "$LIC" && test -n "$ZLIB"
          cp "$SRC" runtime/ffmpeg-8.1.3.tar.xz
          cp "$LIC" runtime/ffmpeg.LICENSE
          cp "$ZLIB" runtime/zlib.LICENSE
          ls -la runtime/

      - name: Cross-build FFmpeg 8.1.3 windows-arm64 (llvm-mingw)
        run: |
          set -euo pipefail
          source_hash="$(sha256sum runtime/ffmpeg-8.1.3.tar.xz | cut -d' ' -f1)"
          test "$source_hash" = "$AUDIT_FFMPEG_SOURCE" || { echo "source tar mismatch: $source_hash"; exit 1; }
          mkdir -p runtime/src
          tar -xf runtime/ffmpeg-8.1.3.tar.xz -C runtime/src --strip-components=1
          cd runtime/src
          export PATH="$GITHUB_WORKSPACE/llvm-mingw/bin:$PATH"
          # 可复现：固定 SOURCE_DATE_EPOCH 并让 lld 不写 PE 时间戳，否则每轮哈希都变
          export SOURCE_DATE_EPOCH=0
          ./configure --prefix="$PWD/dist" --arch=aarch64 --target-os=mingw32 \
            --cross-prefix=aarch64-w64-mingw32- --enable-cross-compile \
            --disable-debug --disable-doc --disable-ffplay --disable-ffprobe --disable-avdevice \
            --disable-network --disable-autodetect --disable-gpl --disable-nonfree \
            --enable-static --disable-shared --disable-zlib --enable-mediafoundation --enable-d3d11va \
            --extra-ldflags="-static -static-libgcc -static-libstdc++ -Wl,--no-insert-timestamp"
          make -j"$(nproc)"
          test -f ffmpeg.exe
          file ffmpeg.exe
          llvm-objdump -f ffmpeg.exe | grep -iE 'aarch64|arm64'
          ffmpeg_hash="$(sha256sum ffmpeg.exe | cut -d' ' -f1)"
          echo "built windows-arm64 ffmpeg sha256 = $ffmpeg_hash"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ffmpeg.exe "$GITHUB_WORKSPACE/out/ffmpeg.exe"
          cp ../ffmpeg-8.1.3.tar.xz "$GITHUB_WORKSPACE/out/ffmpeg-8.1.3.tar.xz"
          cp ../ffmpeg.LICENSE "$GITHUB_WORKSPACE/out/ffmpeg.LICENSE"
          cp ../zlib.LICENSE "$GITHUB_WORKSPACE/out/zlib.LICENSE"
          # 从生成的 config.h 取证：h264_mf 编码器确实编译进来（不是只写文档）
          # FFmpeg 把编解码器宏写在 config_components.h
          grep -q "define CONFIG_H264_MF_ENCODER 1" config_components.h || { echo "h264_mf encoder not enabled"; exit 1; }
          {
            echo "Pet Manager FFmpeg runtime (windows-arm64, cross-built in CI from the audited source tar)"
            echo "FFmpeg version: 8.1.3"
            echo "H.264 encoder used by Pet Manager: h264_mf (Media Foundation)"
            echo "CONFIG_H264_MF_ENCODER=1"
            echo "./configure --arch=aarch64 --target-os=mingw32 --enable-cross-compile --disable-debug --disable-doc --disable-ffplay --disable-ffprobe --disable-avdevice --disable-network --disable-autodetect --disable-gpl --disable-nonfree --enable-static --disable-shared --disable-zlib --enable-mediafoundation --enable-d3d11va"
          } > "$GITHUB_WORKSPACE/out/ffmpeg.README"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-runtime
          path: out/

  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 120
    needs: windows-arm64-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage firmware OTA inputs
        run: python pc/scripts/stage-release-firmware.py

      - name: Fetch the official arm64 Node (checksum-verified)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$env:NODE_VERSION/node-$env:NODE_VERSION-win-arm64.zip" -OutFile node.zip -MaximumRedirection 5
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$env:NODE_VERSION/SHASUMS256.txt" -OutFile SHASUMS256.txt
          $expected = (Select-String -Path SHASUMS256.txt -Pattern "node-.+-win-arm64\.zip").Line.Split(' ')[0]
          $actual = (Get-FileHash -Algorithm SHA256 node.zip).Hash.ToLower()
          if ($expected -ne $actual) { throw "node zip hash mismatch: $actual" }
          Expand-Archive -Path node.zip -DestinationPath . -Force
          Copy-Item "node-$env:NODE_VERSION-win-arm64\node.exe" runtime\node.exe
          $hash = (Get-FileHash -Algorithm SHA256 runtime\node.exe).Hash.ToLower()
          Write-Host "official win-arm64 node sha256 = $hash"

      - name: Download the cross-built FFmpeg runtime
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-runtime
          path: runtime/

      - name: Export runtime for prepare
        shell: pwsh
        run: |
          test -f runtime\ffmpeg.exe
          test -f runtime\ffmpeg.README
          test -f runtime\ffmpeg-8.1.3.tar.xz
          test -f runtime\ffmpeg.LICENSE
          {
            "PET_MANAGER_FFMPEG_BIN=$env:GITHUB_WORKSPACE\runtime\ffmpeg.exe"
            "PET_MANAGER_FFMPEG_README=$env:GITHUB_WORKSPACE\runtime\ffmpeg.README"
            "PET_MANAGER_FFMPEG_LICENSE=$env:GITHUB_WORKSPACE\runtime\ffmpeg.LICENSE"
            "PET_MANAGER_FFMPEG_SOURCE_ARCHIVE=$env:GITHUB_WORKSPACE\runtime\ffmpeg-8.1.3.tar.xz"
            "PET_MANAGER_ZLIB_LICENSE=$env:GITHUB_WORKSPACE\runtime\zlib.LICENSE"
            "PET_MANAGER_NODE_BIN=$env:GITHUB_WORKSPACE\runtime\node.exe"
            "PET_MANAGER_TARGET_ARCH=arm64"
          } >> $env:GITHUB_ENV
          # prepare 对 terrier-clips 调 PATH 上的 ffmpeg 做时长探测（追加语义走 GITHUB_PATH）
          "$env:GITHUB_WORKSPACE\runtime" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: npm ci (client)
        working-directory: pc
        run: npm ci

      - name: Restore audited bridge production dependencies (locked)
        working-directory: pc/src-tauri/bridge/packages/clawd-backend-service
        run: npm ci

      - name: Prepare desktop resources
        working-directory: pc
        env:
          CL: /std:c20
          # 显式传架构：GITHUB_ENV 的传递在 arm64 runner 上未生效，prepare 会回落 x64
          PET_MANAGER_TARGET_ARCH: arm64
          PET_MANAGER_FFMPEG_BIN: ${{ github.workspace }}\runtime\ffmpeg.exe
          PET_MANAGER_FFMPEG_README: ${{ github.workspace }}\runtime\ffmpeg.README
          PET_MANAGER_FFMPEG_LICENSE: ${{ github.workspace }}\runtime\ffmpeg.LICENSE
          PET_MANAGER_FFMPEG_SOURCE_ARCHIVE: ${{ github.workspace }}\runtime\ffmpeg-8.1.3.tar.xz
          PET_MANAGER_ZLIB_LICENSE: ${{ github.workspace }}\runtime\zlib.LICENSE
          PET_MANAGER_NODE_BIN: ${{ github.workspace }}\runtime\node.exe
        run: npm run prepare:desktop

      - name: Build (tauri build nsis for arm64)
        working-directory: pc
        env:
          PET_MANAGER_TARGET_ARCH: arm64
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis --ci

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item pc\src-tauri\target\aarch64-pc-windows-msvc\release\bundle\nsis\*.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-installer
          path: dist/

  publish-release:
    runs-on: ubuntu-latest
    needs: [windows-x64, windows-arm64, macos-arm64, macos-x64]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version pc/src-tauri/tauri.conf.json)"
          mkdir -p dist
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} dist/ \;
          # 发布名对齐应用内更新器的约定：Windows 资产含 windows 与架构名，macOS 为 .dmg
          for f in dist/*x64-setup.exe; do [ -e "$f" ] && mv "$f" "dist/HachimoDock_${VERSION}_Windows-x64-setup.exe"; done
          for f in dist/*arm64-setup.exe; do [ -e "$f" ] && mv "$f" "dist/HachimoDock_${VERSION}_Windows-arm64-setup.exe"; done
          for f in dist/*aarch64.dmg; do [ -e "$f" ] && mv "$f" "dist/HachimoDock_${VERSION}_macOS-arm64.dmg"; done
          for f in dist/*_x64.dmg; do [ -e "$f" ] && mv "$f" "dist/HachimoDock_${VERSION}_macOS-x64.dmg"; done
          for f in dist/*.msi; do [ -e "$f" ] && mv "$f" "dist/HachimoDock_${VERSION}_x64_en-US.msi"; done
          cd dist && sha256sum * > SHA256SUMS
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version pc/src-tauri/tauri.conf.json)"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "HachimoDock-beautiful ${VERSION}" --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json tagName,isLatest,assets --jq '{tag:.tagName, latest:.isLatest, assets:[.assets[].name]}'
