<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HachimiDock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: rgba(29, 29, 31, .88);
  }
  @media (prefers-color-scheme: dark) {
    body { color: rgba(255, 255, 255, .95); }
  }
  .splash-card {
    width: 264px; padding: 34px 28px 26px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    border-radius: 24px;
    background: rgba(255, 255, 255, .74);
    border: 1px solid rgba(255, 255, 255, .55);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .08), 0 16px 48px rgba(0, 0, 0, .16);
    position: relative; overflow: hidden;
    backdrop-filter: blur(40px) saturate(160%);
    -webkit-backdrop-filter: blur(40px) saturate(160%);
  }
  .splash-card::before {
    content: ""; position: absolute; inset: 0 0 50% 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .38), rgba(255, 255, 255, 0));
  }
  @media (prefers-color-scheme: dark) {
    .splash-card {
      background: rgba(30, 30, 34, .78);
      border-color: rgba(255, 255, 255, .12);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3), 0 16px 48px rgba(0, 0, 0, .45);
    }
    .splash-card::before {
      background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0));
    }
  }
  .logo {
    width: 84px; height: 84px; border-radius: 22px;
    animation: breathe 2s ease-in-out infinite;
    filter: drop-shadow(0 6px 16px rgba(241, 116, 10, .28));
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  .wordmark { font-size: 21px; font-weight: 700; letter-spacing: .3px; }
  .tagline { font-size: 12px; opacity: .58; margin-top: -10px; }
  .dots { display: flex; gap: 7px; margin-top: 2px; }
  .dots i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #f1740a; opacity: .25;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse {
    0%, 100% { opacity: .25; transform: scale(1); }
    45% { opacity: .9; transform: scale(1.18); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .dots i { animation: none; }
    .dots i { opacity: .55; }
  }
</style>
</head>
<body>
  <div class="splash-card">
    <img class="logo" src="/src/assets/logo/hachimodock-mark.png" alt="">
    <div class="wordmark">HachimoDock</div>
    <div class="tagline">桌宠管理端</div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
</body>
</html>
